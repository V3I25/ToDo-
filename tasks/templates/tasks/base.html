<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контроль задач</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --accent: #f1f5f9;
        --success: #16a34a;
        --warning: #f97316;
        --danger: #dc2626;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        background: var(--card);
        border-bottom: 1px solid var(--border);
        padding: 24px 0;
      }

      .container {
        width: min(1100px, 92%);
        margin: 0 auto;
      }

      h1,
      h2,
      h3 {
        margin: 0 0 12px;
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.04);
      }

      .badge {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--accent);
        color: var(--muted);
      }

      .badge.success {
        background: rgba(22, 163, 74, 0.12);
        color: var(--success);
      }

      .badge.warning {
        background: rgba(249, 115, 22, 0.12);
        color: var(--warning);
      }

      .badge.danger {
        background: rgba(220, 38, 38, 0.12);
        color: var(--danger);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .button {
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      .button.secondary {
        background: var(--accent);
        color: var(--text);
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .meta {
        color: var(--muted);
        font-size: 14px;
      }

      .progress {
        background: var(--accent);
        border-radius: 999px;
        height: 10px;
        overflow: hidden;
        width: 100%;
      }

      .progress > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        width: 0;
      }

      form .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      input,
      textarea,
      select {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font: inherit;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      .subtask {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Панель контроля задач</h1>
        <p class="meta">
          Следите за выполнением, прогрессом, напоминаниями и соблюдением плана.
        </p>
      </div>
    </header>
    <main class="container" style="padding: 24px 0 48px;">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
