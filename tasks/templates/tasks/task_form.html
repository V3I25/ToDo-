{% extends "tasks/base.html" %}

{% block content %}
  <div class="card">
    <h2>{{ action }} задачу</h2>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_title">Название</label>
        {{ form.title }}
      </div>
      <div class="field">
        <label for="id_description">Описание</label>
        {{ form.description }}
      </div>
      <div class="field">
        <label for="id_status">Статус</label>
        {{ form.status }}
      </div>
      <div class="field">
        <label for="id_progress">Прогресс (%)</label>
        {{ form.progress }}
      </div>
      <div class="field">
        <label for="id_plan_start">Плановая дата начала</label>
        {{ form.plan_start }}
      </div>
      <div class="field">
        <label for="id_plan_end">Плановая дата завершения</label>
        {{ form.plan_end }}
      </div>
      <div class="field">
        <label for="id_reminder_at">Напоминание</label>
        {{ form.reminder_at }}
      </div>
      <div class="actions">
        <button class="button" type="submit">{{ action }}</button>
        <a class="button secondary" href="{% url 'tasks:list' %}">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
